apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
// apply plugin: 'com.google.gms.google-services'

// Read signing credentials from local.properties (git-ignored).
// Required keys: KEYSTORE_FILE, KEY_ALIAS, KEYSTORE_PASSWORD, KEY_PASSWORD.
def signingProps = new Properties()
def signingPropsFile = rootProject.file('local.properties')
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}
def hasReleaseSigning = signingProps['KEYSTORE_FILE'] \
        && signingProps['KEY_ALIAS'] \
        && signingProps['KEYSTORE_PASSWORD'] \
        && signingProps['KEY_PASSWORD']

android {
    compileSdkVersion 36
    buildToolsVersion "35.0.0"
    // viewBinding true
    buildFeatures {
        viewBinding true
        dataBinding true
    }
    defaultConfig {
        applicationId "online.avogadro.opencv4tasker"
        minSdkVersion 30
        targetSdkVersion 36
        versionCode 1800
        versionName "1.8.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled = true

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }

    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(signingProps['KEYSTORE_FILE'])
                storePassword signingProps['KEYSTORE_PASSWORD']
                keyAlias signingProps['KEY_ALIAS']
                keyPassword signingProps['KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    namespace 'online.avogadro.opencv4tasker'
}

repositories {
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    // implementation fileTree(dir: '../libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core-ktx:1.13.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    // ML Kit Object Detection
    // implementation 'com.google.mlkit:object-detection:17.0.1'

    // MediaPipe Tasks Vision (replaces tensorflow-lite-task-vision, compiled with 16KB ELF alignment)
    implementation 'com.google.mediapipe:tasks-vision:0.10.21'

//    implementation project(':opencv')

    // implementation 'com.squareup.okhttp3:okhttp:3.12.0'
    // implementation 'com.alibaba:fastjson:1.1.67.android'
    // implementation 'com.google.code.gson:gson:2.10'
    // implementation 'com.google.zxing:core:3.3.3'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'

    // implementation 'io.reactivex.rxjava2:rxjava:2.2.6'
    // implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'

    // others
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.material:material:1.12.0'
    // implementation 'com.github.bumptech.glide:glide:4.11.0'


    // Tasker plugin
    implementation 'com.joaomgcd:taskerpluginlibrary:0.4.10'

    // LiteRT-LM: on-device multimodal LLM inference (Gemma 4 E2B)
    implementation 'com.google.ai.edge.litertlm:litertlm-android:0.11.0'


}
